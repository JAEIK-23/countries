<!DOCTYPE html>
<html>
<head>
  <title>나라 정보</title>
</head>
<body>

  <h3>나라 이름을 입력하세요</h3>
  <input id="country" placeholder="예: south korea">
  <button onclick="search()">검색</button>

  <div id="info"></div>

  <script>
    function search() {
      let name = document.getElementById("country").value;  
      let info = document.getElementById("info");           


      let url = "https://restcountries.com/v3.1/name/" + name + "?fullText=true";

      
      fetch(url)
        .then((response) => response.json())
        .then((data) => {
          
          let capital = data[0].capital[0];
          let flag = data[0].flags.png;

          
          info.innerHTML = "수도: " + capital;
          info.innerHTML += "<img src='" + flag + "'>";
    })
       
    }
  </script>

</body>
</html>
